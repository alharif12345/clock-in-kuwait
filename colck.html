<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CYBER CLOCK</title>
    <link rel="stylesheet" href="clock.css">
</head>
<body>

    <canvas id="particles"></canvas>

    <div class="ambient ambient1"></div>
    <div class="ambient ambient2"></div>

    <main class="container">

        <div class="top">
            <div class="status">
                <span class="live"></span>
                SYSTEM ONLINE
            </div>

            <div class="label">CYBER SYSTEM / 001</div>
        </div>

        <h1 class="title">
            <span>CYBER</span> CLOCK
        </h1>

        <div class="clock-wrapper">
            <div id="clock" class="clock"></div>
        </div>

        <div id="date" class="date"></div>

        <div class="bottom">

            <div class="info-box">
                <span class="info-title">TIME STATUS</span>
                <span class="info-value">LIVE</span>
            </div>

            <div class="info-box">
                <span class="info-title">SYSTEM</span>
                <span class="info-value">ACTIVE</span>
            </div>

            <div class="info-box">
                <span class="info-title">MODE</span>
                <span class="info-value">NEON</span>
            </div>

        </div>

        <div class="footer">
            <span>DESIGNED IN CYBER SPACE</span>
            <span>∞ FUTURE</span>
        </div>

    </main>

    <script src="clock.js"></script>

</body>
</html>
